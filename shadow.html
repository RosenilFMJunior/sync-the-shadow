<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC - Maximum Saturation // Shadow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Preto absoluto para destacar o neon */
            color: #00ffcc; /* Verde-ciano de alta saturação */
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Força o renderizador do navegador a saturar as cores ao máximo */
            contrast: 200%;
            image-rendering: pixelated;
        }

        /* Plano Cartesiano Hiper-Saturado */
        .cartesian-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .axis-x {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #00ffcc;
            opacity: 0.15;
            box-shadow: 0 0 8px #00ffcc;
        }
        .axis-y {
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background: #00ffcc;
            opacity: 0.15;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Container de Transição */
        #viewport-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 2.2s cubic-bezier(0.85, 0, 0.15, 1), opacity 1.8s;
            transform-origin: center center;
        }

        /* O ESPAÇO MÍNIMO (Ponto Puro Invariante) */
        #minimum-space {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 10px #ffffff;
        }

        /* Tela de Entrada / Portal */
        #portal-screen {
            text-align: center;
            z-index: 30;
            transition: opacity 0.4s;
        }

        .sync-btn {
            background: #000000;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 18px 36px;
            font-family: monospace;
            font-size: 13px;
