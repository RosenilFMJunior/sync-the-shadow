<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC // THE SHADOW OF THE MINIMUM SPACE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00ffcc;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            contrast: 200%;
            image-rendering: pixelated;
        }

        /* Plano Cartesiano */
        .cartesian-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .axis-x {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #00ffcc;
            opacity: 0.15;
            box-shadow: 0 0 8px #00ffcc;
        }
        .axis-y {
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background: #00ffcc;
            opacity: 0.15;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Container de Transição */
        #viewport-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 2.2s cubic-bezier(0.85, 0, 0.15, 1), opacity 1.8s;
            transform-origin: center center;
        }

        /* O ESPAÇO MÍNIMO */
        #minimum-space {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 10px #ffffff;
        }

        /* Portal de Entrada */
        #portal-screen {
            text-align: center;
            z-index: 30;
            transition: opacity 0.4s;
        }

        .sync-btn {
            background: #000000;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 18px 36px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            text-shadow: 0 0 5px #00ffcc;
            transition: all 0.3s ease-in-out;
        }

        .sync-btn:hover {
            background: #00ffcc;
            color: #000000;
            box-shadow: 0 0 30px #00ffcc;
            text-shadow: none;
        }

        /* Painel de Telemetria */
        #telemetry {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.8;
            letter-spacing: 1.5px;
            color: rgba(0, 255, 204, 0.6);
            text-shadow: 0 0 3px rgba(0, 255, 204, 0.3);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.8s;
            pointer-events: none;
        }

        .highlight {
            color: #ffffff;
            text-shadow: 0 0 8px #00ffcc, 0 0 15px #00ffcc;
        }

        /* Estado de Colapso Máximo */
        .collapsed {
            transform: scale(0.0001);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="cartesian-plane">
        <div class="axis-x"></div>
        <div class="axis-y"></div>
    </div>

    <div id="portal-screen">
        <button class="sync-btn" id="start-trigger">// DISPARAR_SINTONIZACAO_MAXIMA</button>
    </div>

    <div id="viewport-container">
        <div id="minimum-space"></div>
    </div>

    <div id="telemetry">
        <div>MATRIZ: SYNC // THE SHADOW [SATURATED]</div>
        <div>TEMPO DE FLUXO (t): <span id="val-t" class="highlight">0</span>s</div>
        <div>DENSIDADE ENERGIA (&rho;_E): <span id="val-rho" class="highlight">100</span>%</div>
        <div>ENTROPIA ACUMULADA (S): <span id="val-s" class="highlight">0</span></div>
        <div>ESTADO EXISTENCIAL (&Psi;): <span id="val-psi" class="highlight">1.0000</span></div>
    </div>

        const telaPortal = document.getElementById('portal-screen');
        const containerEfeito = document.getElementById('viewport-container');
        const pontoCentral = document.getElementById('minimum-space');
        const painelTelemetria = document.getElementById('telemetry');

        const energiaMaxima = 100;
        const I_x0 = 1.0;

            t += 0.04;

            const rho_E = energiaMaxima * Math.exp(-taxaDiluicao * t);

            const psi_t = (rho_E * I_x0) - S;

                const raioSombra = S * 6; 
                const opacidadeSombra = Math.min((psi_t / energiaMaxima) * 1.5, 0.95);
                
                pontoCentral.style.boxShadow = `0 0 ${raioSombra}px ${raioSombra / 1.5}px rgba(0, 255, 204, ${opacidadeSombra}), 0 0 10px #ffffff`;

                txtT.innerText = t.toFixed(1);
                txtRho.innerText = rho_E.toFixed(1);
