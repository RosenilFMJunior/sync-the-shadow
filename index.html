<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC | The Shadow</title>
    <style>
        /* Estética do Vazio e Meditação */
        body { 
            margin: 0; 
            background: #050505; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            color: white; 
            font-family: 'Courier New', Courier, monospace;
            transition: background 2s ease-in-out;
        }

        /* O Efeito da Sombra (Silhueta) com Transição de Cor via Filtros CSS */
        canvas#videoCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35; /* Sombra sutil ao fundo */
            z-index: 1;
            transition: filter 0.8s ease-in-out;
        }

        /* Classes de Sinal do IERO que alteram a cor da silhueta invertida */
        /* Mistura de grayscale, invert e sepia com hue-rotate para gerar as 3 cores místicas */
        .sinal-verde #videoCanvas {
            filter: brightness(0.4) contrast(2.5) grayscale(1) invert(1) sepia(1) hue-rotate(90deg) saturate(3);
        }
        
        .sinal-amarelo #videoCanvas {
            filter: brightness(0.4) contrast(2.5) grayscale(1) invert(1) sepia(1) hue-rotate(15deg) saturate(3);
        }
        
        .sinal-vermelho #videoCanvas {
            filter: brightness(0.4) contrast(2.5) grayscale(1) invert(1) sepia(1) hue-rotate(320deg) saturate(4);
        }

        /* O Círculo Principal e Elementos Visuais */
        .circle-container { 
            position: relative; 
            width: 250px; 
            height: 250px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: all 1.5s ease; 
            z-index: 2;
        }
        
        .main-circle { 
            width: 100%; 
            height: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 50%; 
            position: absolute; 
            animation: breathe 8s infinite ease-in-out; 
            transition: 1.5s;
        }
        
        /* A Cicatriz (O que tinha sido perdido) */
        .shadow-cut { 
            width: 1px; 
            height: 60%; 
            background: rgba(255, 255, 255, 0.2); 
            position: absolute; 
            transform: rotate(45deg); 
            transition: 1s; 
        }
        
        /* Estado de Brilho Dinâmico pelas Cores do IERO no Círculo */
        .sinal-verde .main-circle { 
            border-color: #2ecc71; 
            box-shadow: 0 0 50px rgba(46, 204, 113, 0.25); 
            transform: scale(1.05);
        }
        .sinal-verde .shadow-cut { background: #2ecc71; box-shadow: 0 0 20px #2ecc71; }

        .sinal-amarelo .main-circle { 
            border-color: #f1c40f; 
            box-shadow: 0 0 40px rgba(241, 196, 15, 0.2); 
            transform: scale(1.02);
        }
        .sinal-amarelo .shadow-cut { background: #f1c40f; box-shadow: 0 0 10px #f1c40f; }

        .sinal-vermelho .main-circle { 
            border-color: #e74c3c; 
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.15); 
            transform: scale(0.98);
        }
        .sinal-vermelho .shadow-cut { background: #e74c3c; box-shadow: 0 0 5px #e74c3c; }
        
        @keyframes breathe { 
            0%, 100% { transform: scale(1); opacity: 0.3; } 
            50% { transform: scale(1.03); opacity: 0.6; } 
        }
        
        /* Status Text */
        .status { 
            margin-top: 40px; 
            letter-spacing: 5px; 
            font-size: 0.65rem; 
            opacity: 0.5; 
            text-align: center; 
            width: 80%; 
            line-height: 1.8; 
            z-index: 2;
            text-transform: uppercase;
            transition: opacity 0.5s;
        }

        /* Estado Meditativo Coletivo: Respiração do Plano de Fundo */
        .meditation-active {
            animation: breath-bg 6s infinite ease-in-out;
        }

        @keyframes breath-bg {
            0% { background: #050505; }
            50% { background: #0b0f0b; } /* Leve pulsação esmeralda no zen */
            100% { background: #050505; }
        }
    </style>
</head>
<body class="sinal-vermelho"> <canvas id="videoCanvas"></canvas>

    <div class="circle-container" id="visual">
        <div class="main-circle"></div>
        <div class="shadow-cut"></div>
    </div>
    
    <div id="status" class="status">ESPERANDO PELO ESPELHO...</div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const visual = document.getElementById('visual');
        const status = document.getElementById('status');
        
        let video;
        let lastFrameData;
        const SENSITIVITY = 70000; 

        // Variável Dinâmica do IERO (Inicia em 0% e busca a estabilidade)
        let iero = 0; 

        async function init() {
            try {
                // Força o uso da câmera frontal ('user') nativamente para o teste no celular
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                video.play();

                video.addEventListener('loadedmetadata', () => {
                    requestAnimationFrame(renderLoop);
                    setInterval(analysisLoop, 150); 
                });

            } catch (e) {
                status.innerText = "O ESPELHO PRECISA DA TUA CÂMARA.";
                console.error(e);
            }
        }

        // 1. Loop de Renderização da Imagem (60fps)
        function renderLoop() {
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                ctx.save();
                // Centraliza e rotaciona 180° para compensar o celular invertido
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(Math.PI);
                ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                ctx.restore();
            }
            requestAnimationFrame(renderLoop);
        }

        // 2. Loop de Análise Matemática do Movimento com Motor IERO
        function analysisLoop() {
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;

            const checkCanvas = document.createElement('canvas');
            const checkCtx = checkCanvas.getContext('2d');
            checkCanvas.width = 32; 
            checkCanvas.height = 32;

            checkCtx.translate(16, 16);
            checkCtx.rotate(Math.PI);
            checkCtx.drawImage(video, -16, -16, 32, 32);

            // Coleta a metade superior para focar no tronco/pose do usuário
            const currentFrameData = checkCtx.getImageData(0, 0, 32, 16).data;

            if (lastFrameData) {
                let diff = 0;
                for (let i = 0; i < currentFrameData.length; i += 4) {
                    diff += Math.abs(currentFrameData[i] - lastFrameData[i]);       // R
                    diff += Math.abs(currentFrameData[i+1] - lastFrameData[i+1]);   // G
                    diff += Math.abs(currentFrameData[i+2] - lastFrameData[i+2]);   // B
                }

                const isStill = diff < SENSITIVITY;

                // --- ALGORITMO DE EVOLUÇÃO DO IERO ---
                if (isStill) {
                    // Quanto mais tempo imóvel, mais o IERO escala em direção à resolução (máx 100)
                    iero = Math.min(100, iero + 8); 
                } else {
                    // Qualquer agitação joga a estabilidade operacional para baixo drasticamente
                    // Mapeia o delta do movimento para penalizar proporcionalmente
                    let penalidade = Math.min(25, Math.floor(diff / 15000));
                    iero = Math.max(0, iero - (penalidade > 5 ? penalidade : 6));
                }

                // --- MÁQUINA DE ESTADOS DE SINAIS (CORES) ---
                document.body.classList.remove('sinal-verde', 'sinal-amarelo', 'sinal-vermelho');

                if (iero >= 85) {
                    // 🟢 ESTADO ZEN (Estabilidade Máxima)
                    document.body.classList.add('sinal-verde');
                    document.body.classList.add('meditation-active');
                    status.innerHTML = `IERO: ${iero}%<br>A SOMBRA FINALMENTE TE RECONHECE.`;
                } else if (iero >= 40 && iero < 85) {
                    // 🟡 ESTADO DE TRANSIÇÃO (Alerta / Busca de Eixo)
                    document.body.classList.add('sinal-amarelo');
                    document.body.classList.remove('meditation-active');
                    status.innerHTML = `IERO: ${iero}%<br>PROCURANDO A RESOLUÇÃO INTERNA...`;
                } else {
                    // 🔴 ESTADO DE RUPTURA (Agitação / Ruído do Ego)
                    document.body.classList.add('sinal-vermelho');
                    document.body.classList.remove('meditation-active');
                    status.innerHTML = `IERO: ${iero}%<br>O EGO FALA ATRAVÉS DO MOVIMENTO.`;
                }
            }

            lastFrameData = currentFrameData;
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        init();
    </script>
</body>
</html>
<style>
    .sync-portal {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 2px;
        z-index: 100;
    }

    .sync-portal a {
        color: rgba(255, 255, 255, 0.3);
        text-decoration: none;
        transition: color 0.4s, text-shadow 0.4s;
        padding: 5px 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(0, 0, 0, 0.5);
    }

    /* O portal ganha um leve brilho ciano ao passar o mouse, sugerindo a assinatura da sombra */
    .sync-portal a:hover {
        color: #00ffcc;
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        border-color: rgba(0, 255, 204, 0.2);
    }
</style>
