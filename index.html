<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC // THE SHADOW OF THE MINIMUM SPACE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00ffcc;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            contrast: 200%;
            image-rendering: pixelated;
        }

        /* Plano Cartesiano */
        .cartesian-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15; /* Fica acima da câmera, abaixo do portal */
        }
        .axis-x {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #00ffcc;
            opacity: 0.15;
            box-shadow: 0 0 8px #00ffcc;
        }
        .axis-y {
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background: #00ffcc;
            opacity: 0.15;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Container de Transição (A Imagem da Câmera) */
        #viewport-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 2.5s cubic-bezier(0.85, 0, 0.15, 1), opacity 1.8s;
            transform-origin: center center;
            z-index: 5;
        }

        /* Elemento de Vídeo da Câmera Humana */
        #camera-feed {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(3) contrast(1.5); /* Saturação extrema do feed biológico */
        }

        /* O ESPAÇO MÍNIMO (Ponto Puro Invariante) */
        #minimum-space {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 25;
            box-shadow: 0 0 10px #ffffff;
        }

        /* Portal de Entrada */
        #portal-screen {
            text-align: center;
            z-index: 30;
            transition: opacity 0.4s;
        }

        .sync-btn {
            background: #000000;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 18px 36px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            text-shadow: 0 0 5px #00ffcc;
            transition: all 0.3s ease-in-out;
        }

        .sync-btn:hover {
            background: #00ffcc;
            color: #000000;
            box-shadow: 0 0 30px #00ffcc;
            text-shadow: none;
        }

        /* Painel de Telemetria */
        #telemetry {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.8;
            letter-spacing: 1.5px;
            color: rgba(0, 255, 204, 0.6);
            text-shadow: 0 0 3px rgba(0, 255, 204, 0.3);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.8s;
            pointer-events: none;
        }

        .highlight {
            color: #ffffff;
            text-shadow: 0 0 8px #00ffcc, 0 0 15px #00ffcc;
        }

        /* Estado de Colapso Máximo (Esmaga o feed da câmera para o nada) */
        .collapsed {
            transform: scale(0.0001);
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="cartesian-plane">
        <div class="axis-x"></div>
        <div class="axis-y"></div>
    </div>

    <div id="portal-screen">
        <button class="sync-btn" id="start-trigger">// DISPARAR_SINTONIZACAO_MAXIMA</button>
    </div>

    <div id="viewport-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div id="minimum-space"></div>
    </div>

    <div id="telemetry">
        <div>MATRIZ: SYNC // THE SHADOW [VIDEO_SATURATED]</div>
        <div>TEMPO DE FLUXO (t): <span id="val-t" class="highlight">0</span>s</div>
        <div>DENSIDADE ENERGIA (&rho;_E): <span id="val-rho" class="highlight">100</span>%</div>
        <div>ENTROPIA ACUMULADA (S): <span id="val-s" class="highlight">0</span></div>
        <div>ESTADO EXISTENCIAL (&Psi;): <span id="val-psi" class="highlight">1.0000</span></div>
    </div>

    <script>
        const btnIniciar = document.getElementById('start-trigger');
        const telaPortal = document.getElementById('portal-screen');
        const containerEfeito = document.getElementById('viewport-container');
        const videoFeed = document.getElementById('camera-feed');
        const pontoCentral = document.getElementById('minimum-space');
        const painelTelemetria = document.getElementById('telemetry');

        const txtT = document.getElementById('val-t');
        const txtRho = document.getElementById('val-rho');
        const txtS = document.getElementById('val-s');
        const txtPsi = document.getElementById('val-psi');

        let t = 0;
        const taxaDiluicao = 0.02;
        const ritmoEntropia = 0.007;
        const estresseOxidativo = 1.6; 
        const energiaMaxima = 100;
        const I_x0 = 1.0;

        // Ativa a câmera real assim que a página carrega
        async function inicializarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, /* Tenta a câmera traseira do celular */
                    audio: false 
                });
                videoFeed.srcObject = stream;
            } catch (err) {
                console.error("Acesso à câmera negado. Usando modo de segurança.", err);
                // Fallback caso dê erro de permissão no navegador
                videoFeed.style.backgroundColor = "rgba(0, 255, 204, 0.1)";
            }
        }

        function executarAlgoritmo() {
            t += 0.04;

            const rho_E = energiaMaxima * Math.exp(-taxaDiluicao * t);
            const S = (ritmoEntropia * Math.pow(t, 1.45)) * estresseOxidativo;
            const psi_t = (rho_E * I_x0) - S;

            if (psi_t > 0) {
                const raioSombra = S * 6; 
                const opacidadeSombra = Math.min((psi_t / energiaMaxima) * 1.5, 0.95);
                
                pontoCentral.style.boxShadow = `0 0 ${raioSombra}px ${raioSombra / 1.5}px rgba(0, 255, 204, ${opacidadeSombra}), 0 0 10px #ffffff`;

                txtT.innerText = t.toFixed(1);
                txtRho.innerText = rho_E.toFixed(1);
                txtS.innerText = S.toFixed(2);
                txtPsi.innerText = (psi_t / energiaMaxima).toFixed(4);

                requestAnimationFrame(executarAlgoritmo);
            } else {
                pontoCentral.style.boxShadow = '0 0 50px 25px #ff0055, 0 0 10px #ff0055';
                pontoCentral.style.backgroundColor = '#ff0055';
                
                txtPsi.innerText = "0.0000 // EXPIRADO";
                txtPsi.style.color = '#ff0055';
                txtPsi.style.textShadow = '0 0 10px #ff0055';
                
                document.body.style.color = '#ff0055';
                document.querySelectorAll('.highlight').forEach(el => el.style.color = '#ffffff');
            }
        }

        btnIniciar.addEventListener('click', () => {
            telaPortal.style.opacity = '0';
            setTimeout(() => telaPortal.style.display = 'none', 400);

            // Transição: A imagem ao vivo do ambiente encolhe violentamente até sumir no ponto
            containerEfeito.classList.add('collapsed');

            setTimeout(() => {
                // Retira o ponto e a sombra do contêiner destruído para mantê-los ativos na tela
                document.body.appendChild(pontoCentral); 
                painelTelemetria.style.opacity = '1';
                requestAnimationFrame(executarAlgoritmo);
            }, 2200);
        });

        // Inicializa o sensor biológico ao entrar
        inicializarCamera();
    </script>
</body>
</html>
